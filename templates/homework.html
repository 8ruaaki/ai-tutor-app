<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>宿題プリント生成 - AI Tutor</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        .homework-sheet {
            background: white;
            padding: 40px;
            border-radius: 5px;
            box-shadow: none;
            border: 2px solid #333; /* 印刷時に映えるデザイン */
            min-height: 297mm; /* A4サイズ意識 */
            text-align: left;
            line-height: 1.6;
        }
        .print-btn {
            background: #2d3436;
            color: white;
            padding: 12px 25px;
            border-radius: 5px;
            margin-bottom: 20px;
            cursor: pointer;
        }
        @media print {
            .no-print { display: none; }
            body { background: white; }
            .homework-sheet { border: none; padding: 0; }
        }
        h1, h2 { border-bottom: 2px solid #333; padding-bottom: 5px; }
        code { background: #f4f4f4; padding: 2px 5px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="no-print">
            <h1>📄 パーソナライズ宿題プリント</h1>
            <p>AIが今回のテスト結果から、あなたに最適な復習メニューを作成しました。</p>
            <button class="print-btn" onclick="window.print()">🖨️ プリントして解く</button><br>
            <button onclick="window.location.href='/report_page'" style="background:#636e72; color:white; padding: 12px 25px; border-radius: 5px; cursor: pointer; border: none;">
            ⬅ 採点レポートに戻る(宿題の再発行もこちらから可能です)
        </button><br><br>
            <button onclick="window.location.href='/'"  class='print-btn' style="background:#636e72; color:white; padding: 12px 25px; border-radius: 5px; cursor: pointer; border: none;">トップへ戻る</button>
        </div>

        <div id="homework-display" class="homework-sheet">
            <p id="loading-msg">AIがプリントを作成中です。30秒ほどお待ちください...</p>
        </div>
    </div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const homeworkString = sessionStorage.getItem('generatedHomework');

        if (!homeworkString) {
            alert("宿題データが見つかりませんでした。再度発行してください。");
            window.location.href = '/report_page';
            return;
        }

        try {
            const data = JSON.parse(homeworkString);
            const container = document.getElementById('homework-display');
            
            let html = `<h2>${data.homework_title || "復習プリント"}</h2>`;
            
            html += `<div class="homework-questions">`;
            data.questions.forEach((q, i) => {
                const qText = (q.question || "").replace(/\n/g, '<br>');
                html += `
                <div style="margin-bottom: 25px; border-bottom: 1px dashed #ccc; padding-bottom: 15px;">
                    <div style="font-weight: bold; margin-bottom: 10px;">
                        <span style="background:var(--primary-color); color:white; padding: 2px 8px; border-radius: 4px; font-size: 0.8rem; margin-right: 5px;">${q.type || "問題"}</span>
                        問${i + 1}:
                    </div>
                    <div style="line-height: 1.6;">
                        ${qText}
                    </div>
                </div>`;
            });
            html += `</div>`;
            
            html += `<div class="homework-answers" style="margin-top: 50px; border-top: 3px double #333; padding-top: 20px;">`;
            html += `<h2>【別紙】解答と解説</h2>`;
            data.questions.forEach((q, i) => {
                const explText = (q.explanation || "").replace(/\n/g, '<br>');
                html += `
                <div style="margin-bottom: 25px; background: #f9f9f9; padding: 15px; border-radius: 8px;">
                    <strong style="color:var(--primary-color);">問${i + 1} の解答:</strong> <span style="font-weight:bold; color:#f44336; font-size:1.1rem; margin-left:10px;">${q.correct_answer}</span>
                    <div style="margin-top: 10px; font-size: 0.95rem; line-height: 1.6;">
                        <strong>【解説】</strong><br>
                        ${explText}
                    </div>
                </div>`;
            });
            html += `</div>`;

            container.innerHTML = html;

        } catch(e) {
            document.getElementById('homework-display').innerHTML = `<p style="color:red;">データの読み込みに失敗しました。</p>`;
            console.error(e);
        }

        if (window.MathJax && window.MathJax.typesetPromise) {
            MathJax.typesetPromise().catch((err) => console.log('MathJax error: ', err));
        }
    });
</script>
<script>
  window.MathJax = {
    tex: {
      inlineMath: [['$', '$'], ['\\(', '\\)']],
      displayMath: [['$$', '$$'], ['\\[', '\\]']]
    },
    options: {
      skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre']
    }
  };
</script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

</body>
</html>
